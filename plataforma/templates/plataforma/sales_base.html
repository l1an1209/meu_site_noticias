{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Planos — PortalUP{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Assine o PortalUP e tenha seu próprio portal para publicar e administrar.{% endblock %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/ds.css' %}">
    <link rel="stylesheet" href="{% static 'css/public.css' %}">
    <style>
        :root {
            --primary: #0f766e;
            --brand-navy: #0f172a;
            --accent: #0f766e;
        }
    </style>
    {% include "noticias/partials/meta_pixel.html" %}
</head>
<body class="sales-body">
<nav class="sales-nav">
    <div class="container">
        {% include "noticias/partials/portalup_logo.html" %}
        <div class="d-flex gap-2 align-items-center">
            <a class="btn btn-ds-ghost btn-sm" href="{% url 'entrar' %}">Entrar</a>
            <a class="btn btn-contribuir btn-sm" href="{% url 'pagina_vendas' %}#planos">Começar agora</a>
        </div>
    </div>
</nav>
<main class="container">
    {% block content %}{% endblock %}
</main>
<footer class="sales-footer">PortalUP — plataforma online para criar e administrar o seu portal.</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
