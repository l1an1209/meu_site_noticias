{% extends "plataforma/app/base.html" %}
{% block title %}Galeria{% endblock %}
{% block heading %}Galeria{% endblock %}
{% block content %}
<div class="row g-2">
    {% for foto in fotos %}
    <div class="col-4 col-md-3 col-xl-2">
        <a href="{% url 'app_noticia_editar' foto.noticia_id %}" class="d-block">
            <img src="{{ foto.imagem.url }}" alt="" class="w-100 rounded-3" style="aspect-ratio:1;object-fit:cover">
        </a>
    </div>
    {% empty %}
    <div class="col-12"><div class="empty-state">Nenhuma foto na galeria</div></div>
    {% endfor %}
</div>
{% include "noticias/partials/pagination.html" %}
{% endblock %}
