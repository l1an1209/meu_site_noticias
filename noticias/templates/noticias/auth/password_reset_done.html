{% extends "noticias/base.html" %}
{% block title %}E-mail enviado — {{ site_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="auth-card glass-card p-4 p-lg-5 text-center">
            <h1 class="display-font h3 mb-3">Confira seu e-mail</h1>
            <p class="text-muted">Se a conta existir, o link de redefinição já foi enviado. Ele expira em uma hora.</p>
            <a href="{% url 'entrar' %}" class="btn btn-contribuir">Voltar ao login</a>
        </div>
    </div>
</div>
{% endblock %}
