{% extends "noticias/base.html" %}
{% block title %}Página não encontrada — {{ site_name }}{% endblock %}
{% block content %}
<div class="error-page text-center py-5">
    <p class="ds-badge mb-3">404</p>
    <h1 class="display-font h2">Não encontramos esta página</h1>
    <p class="text-muted">O endereço pode ter mudado ou o conteúdo pertence a outro portal.</p>
    <a href="{% url 'index' %}" class="btn btn-contribuir">Voltar ao início</a>
</div>
{% endblock %}
